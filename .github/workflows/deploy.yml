name: deploy

on:
  workflow_dispatch: {}

jobs:

  pypi:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: 3.9
      - name: Pin build backend to the release-era hatchling
        run: |
          echo "hatchling==1.14.0" > "${{ runner.temp }}/constraints.txt"
          echo "PIP_CONSTRAINT=${{ runner.temp }}/constraints.txt" >> "$GITHUB_ENV"
          echo "PIP_INDEX_URL=https://:2023-04-16T23:56:46Z@time-machines-pypi.sealsecurity.io/" >> "$GITHUB_ENV"
      - name: Package
        run: |
          pip install --upgrade build
          python -m build -s -w
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
