name: build

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional pytest -k expression to run a subset of tests'
        required: false
        default: ''

jobs:
  tests:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        platform: [ubuntu-22.04, windows-latest]
        tox-env: [py37, py38, py39, py310, py311, nolxml, nohtml5lib]
        # Patch versions pinned below: CPython 3.9.24+/3.10.19+/3.11.14+ ship the 2025 html.parser change that treats <iframe> content as raw text, which breaks upstream's html.parser iframe tests.
        include:
          - tox-env: py37
            python-version: 3.7
            continue-on-error: false
          - tox-env: py38
            python-version: 3.8
            continue-on-error: false
          - tox-env: py39
            python-version: '3.9.13'
            continue-on-error: false
          - tox-env: py310
            python-version: '3.10.11'
            continue-on-error: false
          - tox-env: py311
            python-version: '3.11.9'
            continue-on-error: false
          - tox-env: nolxml
            python-version: '3.11.9'
            continue-on-error: false
          - tox-env: nohtml5lib
            python-version: '3.10.11'
            continue-on-error: false
        # exclude:
        #   - platform: windows-latest
        #     tox-env: py311

    env:
      TOXENV: ${{ matrix.tox-env }}

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 40

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      if: "!endsWith(matrix.python-version, '-dev')"
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Set up development Python ${{ matrix.python-version }}
      if: endsWith(matrix.python-version, '-dev')
      uses: deadsnakes/action@v2.1.1
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools build tox coverage
    - name: Test
      shell: bash
      run: |
        if [ -n "${{ inputs.test-filter }}" ]; then
          export PYTEST_ADDOPTS="-k '${{ inputs.test-filter }}'"
        fi
        OVERRIDE=()
        if [[ "$TOXENV" == py* ]]; then
          # Drop the mypy type-check gate from the py* envs' tox command chain; pytest and coverage commands kept.
          # Base-section override with literal paths (tox runs from toxinidir): older tox ignores per-env overrides
          # for envs without their own ini section and does not substitute {toxinidir} inside override values.
          OVERRIDE=(-x "testenv.commands=pytest --cov soupsieve --cov-append ."$'\n'"coverage html -d .tox/${TOXENV}/tmp/coverage"$'\n'"coverage xml"$'\n'"coverage report --show-missing")
        fi
        python -m tox "${OVERRIDE[@]}"
